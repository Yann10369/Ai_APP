# 阿里云 API 配置示例
# 使用方法：
#   1. 复制为 ../backend/.env，并在其中填入真实 ALIYUN_API_KEY
#   2. 或在系统环境变量中导出 ALIYUN_API_KEY=...

# 必填：阿里云百炼 / 通义大模型 API Key
#   获取地址: https://dashscope.console.aliyun.com/apiKey
ALIYUN_API_KEY=your-api-key-here

# 兼容 OpenAI 协议端点（一般无需改）
ALIYUN_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1

# 多模态视觉模型，可选：
#   qwen3-vl-plus   (推荐，阿里云百炼最新)
#   qwen-vl-max     (精度更高)
#   qwen2.5-vl-72b  (开源替代)
ALIYUN_MODEL=qwen3-vl-plus

# HTTP 超时（秒）
ALIYUN_TIMEOUT=30
